name: Build and Deploy Ironforge Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/themes/ironforge/package-lock.json

      - name: Install npm dependencies
        working-directory: web/themes/ironforge
        run: npm ci

      - name: Build Ironforge with Vite
        working-directory: web/themes/ironforge
        run: npm run build

      - name: Verify production assets
        run: |
          test -f web/themes/ironforge/dist/main.js
          test -f web/themes/ironforge/dist/main.css
          test -f web/themes/ironforge/dist/.vite/manifest.json
          test -f config/sync/system.site.yml
          test -f config/sync/core.extension.yml

      - name: Deploy Ironforge theme
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          SOURCE: web/themes/ironforge/
          ARGS: "-rlgoDzvc -i"

      - name: Deploy Drupal configuration
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: /var/www/untwigged.com/public_html/config/sync/
          SOURCE: config/sync/
          ARGS: "-rlgoDzvc -i"